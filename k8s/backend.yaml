apiVersion: v1
kind: Service
metadata:
  name: genops-backend
  namespace: genops-prod
spec:
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: genops-backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: genops-backend
  namespace: genops-prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: genops-backend
  template:
    metadata:
      labels:
        app: genops-backend
    spec:
      containers:
      - name: backend
        image: 01sachinc/genops-ai-backend:latest
        ports:
        - containerPort: 8080
        env:
        - name: SPRING_DATASOURCE_URL
          value: jdbc:postgresql://genops-postgres:5432/genops
        - name: SPRING_DATASOURCE_USERNAME
          value: genops_user
        - name: SPRING_DATASOURCE_PASSWORD
          value: genops_pass
        - name: SPRING_DATA_REDIS_HOST
          value: genops-redis
        - name: SPRING_DATA_REDIS_PORT
          value: "6379"
        - name: VLLM_BASE_URL
          value: "http://vllm-service:8000"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: genops-secrets
              key: jwt-secret
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: "1"
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 15
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: genops-backend-hpa
  namespace: genops-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: genops-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
