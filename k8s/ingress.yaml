apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: genops-ingress
  namespace: genops-prod
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  rules:
  - host: genops.ai.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: genops-frontend
            port:
              number: 80
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: genops-backend
            port:
              number: 8080
