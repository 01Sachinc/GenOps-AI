apiVersion: v1
kind: Service
metadata:
  name: genops-frontend
  namespace: genops-prod
spec:
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: genops-frontend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: genops-frontend
  namespace: genops-prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: genops-frontend
  template:
    metadata:
      labels:
        app: genops-frontend
    spec:
      containers:
      - name: frontend
        image: 01sachinc/genops-ai-frontend:latest
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
