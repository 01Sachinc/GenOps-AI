version: '3.8'

services:
  genops-backend:
    build:
      context: ./backend
    container_name: genops-backend
    ports:
      - "8081:8080"
    environment:
      - REDIS_HOST=genops-redis
      - REDIS_PORT=6379
      - MYSQL_HOST=host.docker.internal
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=genops
      - MYSQL_USER=root
      - MYSQL_PASSWORD=root
      - VLLM_BASE_URL=http://host.docker.internal:8000
      - VLLM_MODEL=Qwen/Qwen2.5-7B-Instruct
      - AI_TIMEOUT=90
      - AI_RETRY_COUNT=3
      - JWT_SECRET=5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - genops-redis
    networks:
      - genops-network

  genops-redis:
    image: redis:7-alpine
    container_name: genops-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - genops-network

  genops-frontend:
    build:
      context: ./frontend
    container_name: genops-frontend
    ports:
      - "5173:80"
    depends_on:
      - genops-backend
    networks:
      - genops-network

networks:
  genops-network:
    driver: bridge

volumes:
  redis-data:
